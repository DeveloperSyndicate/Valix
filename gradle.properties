kotlin.code.style=official
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=true

# Maven Central Checksum Optimization (Reduces published file count by ~60%)
mavenCentralChecksums=md5,sha1
mavenCentralExcludeSignatureChecksums=true
# Maven Central credentials and GPG signing properties should be defined in your global ~/.gradle/gradle.properties.
# Do not commit secrets to this file.
#
# mavenCentralUsername=
# mavenCentralPassword=
# signing.keyId=
# signing.password=
# signing.secretKeyRingFile=