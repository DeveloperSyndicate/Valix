name: Publish to Maven Central

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish to Maven Central
        run: ./gradlew publishToMavenCentral --no-configuration-cache
        env:
          EXCLUDE_SAMPLES: "true"
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

      - name: Extract Version and Release Notes
        id: release_info
        run: |
          VERSION=$(grep -E 'version = "[^"]+"' build.gradle.kts | head -n 1 | sed -E 's/.*version = "([^"]+)".*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          
          # Extract release notes from CHANGELOG.md for the current version
          python3 -c "
          import re
          version = '$VERSION'
          try:
              with open('CHANGELOG.md') as f:
                  content = f.read()
              pattern = rf'##\s*\[(?:Unreleased\]\s*\(v{re.escape(version)}\)|{re.escape(version)}\])(?:[^\n]*)\n(.*?)(?=\n---\s*\n##\s*\[|\n##\s*\[|\Z)'
              match = re.search(pattern, content, re.DOTALL)
              notes = match.group(1).strip() if match else ''
              if not notes:
                  notes = f'Automated release of version {version} published to Maven Central.'
          except Exception as e:
              notes = f'Automated release of version {version} published to Maven Central.'
          
          with open('release_notes.txt', 'w') as out:
              out.write(notes)
          "

      - name: Create Git Tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${{ steps.release_info.outputs.VERSION }}"
          
          # Check if tag already exists in the remote repository
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG_NAME"; then
            echo "Tag $TAG_NAME already exists. Skipping release creation."
          else
            echo "Creating tag and release for $TAG_NAME"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            
            git tag $TAG_NAME
            git push origin $TAG_NAME
            
            gh release create $TAG_NAME \
              --title "Release $TAG_NAME" \
              --notes-file release_notes.txt
          fi

      - name: Generate Dokka Documentation
        run: |
          ./gradlew dokkaHtmlMultiModule --no-configuration-cache
          
          # Replace Dokka default Kotlin logo with Valix logo
          if [ -f "images/logo.png" ]; then
            cp images/logo.png ./build/dokka/htmlMultiModule/images/logo-icon.svg
            cp images/logo.png ./build/dokka/htmlMultiModule/images/logo.png
          fi
          
          # Inject SEO metadata and JSON-LD structured schema to index.html header
          INDEX_FILE="./build/dokka/htmlMultiModule/index.html"
          if [ -f "$INDEX_FILE" ]; then
            SEO_META='<meta name="description" content="Valix is a Kotlin validation framework powered by KSP that generates type-safe validation logic at compile time, enabling reflection-free validation at runtime."><script type="application/ld+json">{"@context":"https://schema.org","@type":"SoftwareSourceCode","name":"Valix","description":"Kotlin validation framework powered by KSP that generates type-safe validation logic at compile time.","programmingLanguage":"Kotlin","license":"https://spdx.org/licenses/Apache-2.0.html","codeRepository":"https://github.com/developersyndicate/valix"}</script>'
            sed -i "s|<head>|<head>${SEO_META}|g" "$INDEX_FILE"
          fi
          
          # Generate sitemap.xml dynamically
          cat <<EOF > ./build/dokka/htmlMultiModule/sitemap.xml
<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
  <url>
    <loc>https://developersyndicate.github.io/Valix/</loc>
    <changefreq>weekly</changefreq>
    <priority>1.0</priority>
  </url>
  <url>
    <loc>https://developersyndicate.github.io/Valix/valix-core/index.html</loc>
    <changefreq>weekly</changefreq>
    <priority>0.8</priority>
  </url>
  <url>
    <loc>https://developersyndicate.github.io/Valix/valix-spring/index.html</loc>
    <changefreq>weekly</changefreq>
    <priority>0.7</priority>
  </url>
  <url>
    <loc>https://developersyndicate.github.io/Valix/valix-ktor/index.html</loc>
    <changefreq>weekly</changefreq>
    <priority>0.7</priority>
  </url>
</urlset>
EOF

          touch ./build/dokka/htmlMultiModule/.nojekyll

      - name: Deploy Dokka Docs to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/dokka/htmlMultiModule
          publish_branch: gh-pages
          commit_message: "docs: publish Dokka API documentation for version ${{ steps.release_info.outputs.VERSION }}"


